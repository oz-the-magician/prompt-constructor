<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konstruktor promptů</title>
<style>
  :root{
    --paper:#F6F5F2; --surface:#FFFFFF; --line:#E7E4DD; --line-strong:#D6D1C6;
    --ink:#17171A; --muted:#6A675E; --faint:#A8A498;
    --accent:#4B3FD6; --accent-tint:#ECEAFB; --accent-ink:#362CB0; --ok:#1E8A5F;
    --img:#0C877A; --img-tint:#D9F1EE; --vid:#C2410C; --vid-tint:#FBE7DD;
    --radius:6px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body[data-mode="image"]{--accent:var(--img);--accent-tint:var(--img-tint);--accent-ink:#0A6E63}
  body[data-mode="video"]{--accent:var(--vid);--accent-tint:var(--vid-tint);--accent-ink:#9A3412}
  body[data-mode="code"]{--accent:#D81B54;--accent-tint:#FCE6EC;--accent-ink:#B01345}

  .app{max-width:1200px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 28px}

  /* masthead */
  header{padding:34px 0 16px;display:flex;align-items:flex-end;justify-content:space-between;
    gap:20px;flex-wrap:wrap;border-bottom:2px solid var(--ink)}
  .brand{display:flex;flex-direction:column;gap:6px;max-width:60ch}
  .brand .mark{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--accent);font-weight:700}
  .brand h1{font-size:clamp(25px,3.4vw,32px);font-weight:800;letter-spacing:-.022em;line-height:1.03;margin:0}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:13.5px;line-height:1.5;max-width:56ch}
  .head-ctrl{display:flex;align-items:center;gap:10px;padding-bottom:4px}

  .segmented{display:inline-flex;background:var(--surface);border:1px solid var(--line-strong);
    border-radius:6px;padding:2px;gap:2px}
  .segmented button{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    border:0;background:transparent;color:var(--muted);padding:5px 10px;border-radius:4px;
    cursor:pointer;transition:all .12s ease;font-weight:600}
  .segmented button:hover{color:var(--ink)}
  .segmented button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .segmented.lang button{min-width:34px}

  /* category nav */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-strong);margin:22px 0 0}
  .tab{font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    border:0;background:none;color:var(--muted);padding:13px 18px 15px;cursor:pointer;position:relative;
    border-bottom:3px solid transparent;margin-bottom:-1px;transition:color .12s ease}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  .tab .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px;
    background:var(--line-strong);vertical-align:middle}
  .tab[data-mode="text"][aria-selected="true"] .dot{background:#4B3FD6}
  .tab[data-mode="image"][aria-selected="true"] .dot{background:#0C877A}
  .tab[data-mode="video"][aria-selected="true"] .dot{background:#C2410C}
  .tab[data-mode="code"][aria-selected="true"] .dot{background:#D81B54}

  .grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:34px;padding:28px 0 48px;align-items:start}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-bottom:16px;min-height:30px;flex-wrap:wrap}
  .panel-head .title{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink);font-weight:700;display:inline-flex;align-items:center}
  .panel-head .title::before{content:"";width:7px;height:7px;background:var(--accent);
    border-radius:1px;margin-right:9px;display:inline-block}

  .block{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-strong);
    border-radius:var(--radius);padding:14px 17px 16px;margin-bottom:13px;
    transition:border-color .15s ease,box-shadow .15s ease}
  .block.filled{border-left-color:var(--accent)}
  .block:focus-within{border-color:var(--line-strong);border-left-color:var(--accent);
    box-shadow:0 2px 14px rgba(20,20,26,.05)}
  .block.special{background:#FBFAF7;border-style:dashed}
  .block.special.filled{border-left-style:solid}
  .block .lbl{display:flex;align-items:baseline;gap:9px;margin-bottom:7px}
  .block .num{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--faint);
    line-height:1;font-variant-numeric:tabular-nums}
  .block.filled .num{color:var(--accent)}
  .block label{font-weight:700;font-size:14.5px;letter-spacing:-.006em;cursor:pointer}
  .block .hint{color:var(--muted);font-size:12.5px;margin:0 0 9px}
  .block textarea{width:100%;border:1px solid var(--line);border-radius:5px;background:#FCFCFB;
    color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding:9px 11px;
    resize:vertical;min-height:40px;transition:border-color .12s ease,background .12s ease,box-shadow .12s ease}
  .block textarea:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-tint)}
  .block textarea::placeholder{color:var(--faint)}
  .block textarea.sm{min-height:40px}
  .block textarea.md{min-height:60px}
  .block textarea.codearea{font-family:var(--mono);font-size:12.5px;line-height:1.5;min-height:130px;tab-size:2;white-space:pre}

  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .chips button{font-family:var(--sans);font-size:11.5px;color:var(--muted);background:var(--paper);
    border:1px solid var(--line);border-radius:20px;padding:3px 10px;cursor:pointer;transition:all .12s ease}
  .chips button:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-tint)}

  .lbl .clr{margin-left:auto;align-self:center;border:0;background:none;color:var(--faint);
    font-size:17px;line-height:1;cursor:pointer;padding:0 2px;display:none}
  .lbl .clr:hover{color:var(--accent-ink)}
  .block.filled .lbl .clr{display:inline-flex}

  .tip{position:fixed;z-index:60;max-width:236px;background:var(--ink);color:#F4F3EF;border-radius:8px;
    padding:11px 12px;box-shadow:0 10px 30px rgba(15,15,20,.30);font-family:var(--sans);font-size:12.5px;
    line-height:1.45;opacity:0;pointer-events:none;transform:translateY(3px);transition:opacity .12s ease,transform .12s ease}
  .tip.show{opacity:1;transform:translateY(0)}
  .tip .tip-vis{width:100%;height:66px;border-radius:5px;background:#26262B;margin-bottom:8px;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .tip .tip-vis svg{width:80px;height:56px;--accent:#9AA6FF}
  .tip .tip-term{font-family:var(--mono);font-size:11px;color:#ABA79C;letter-spacing:.03em;margin-bottom:3px}
  .tip .tip-def{color:#F4F3EF}

  .result-col{position:sticky;top:16px}
  .fmt-hint{font-size:12px;color:var(--muted);margin:0 0 10px;min-height:16px;line-height:1.4;font-style:italic}
  .aspect-bar{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .aspect-bar .ar-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);margin-right:2px}
  .aspect-bar button{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--surface);
    border:1px solid var(--line);border-radius:5px;padding:4px 9px;cursor:pointer;transition:all .12s ease}
  .aspect-bar button:hover{border-color:var(--faint);color:var(--ink)}
  .aspect-bar button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);
    background:var(--accent-tint);font-weight:600}

  .output{background:var(--surface);border:1px solid var(--line-strong);border-top:2px solid var(--accent);
    border-radius:var(--radius);overflow:hidden}
  .output pre{margin:0;padding:20px;font-family:var(--mono);font-size:13px;line-height:1.62;
    white-space:pre-wrap;word-break:break-word;color:var(--ink);
    max-height:calc(100vh - 300px);min-height:260px;overflow:auto;tab-size:2}
  .output pre.empty{color:var(--faint)}
  .output-foot{border-top:1px solid var(--line);padding:11px 14px;display:flex;
    align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#FCFCFB}
  .count{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .acts{display:flex;gap:8px;flex-wrap:wrap}

  button.act{font-family:var(--sans);font-size:13px;font-weight:600;border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer;
    transition:all .12s ease;display:inline-flex;align-items:center;gap:7px}
  button.act:hover{border-color:var(--faint);background:#FBFAF7}
  button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.act.primary:hover{filter:brightness(.94)}
  button.act.done{background:var(--ok);border-color:var(--ok);color:#fff}
  button.act:disabled{opacity:.45;cursor:not-allowed}
  .badge{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--accent-tint);
    color:var(--accent-ink);border-radius:20px;padding:1px 7px;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}

  .link{font-family:var(--sans);font-size:12.5px;color:var(--muted);background:none;border:0;cursor:pointer;padding:2px 0}
  .link:hover{color:var(--accent-ink);text-decoration:underline}
  .fill-meter{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .fill-meter b{color:var(--accent);font-weight:700}
  .ph-right{display:flex;align-items:center;gap:12px}
  .clear-btn{font-family:var(--sans);font-size:12px;font-weight:600;border:1px solid var(--line-strong);
    background:var(--surface);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;transition:all .12s ease}
  .clear-btn:hover{border-color:#E3A9A0;color:#B4351F;background:#fff}
  .clear-btn:disabled{opacity:.4;cursor:not-allowed}
  .clear-btn:disabled:hover{border-color:var(--line-strong);color:var(--muted);background:var(--surface)}
  .clear-btn.arm{border-color:#B4351F;color:#B4351F;background:#FBEAE6;font-weight:700}
  .link.arm{color:#B4351F;font-weight:700;text-decoration:underline}

  footer{border-top:1px solid var(--line);margin-top:auto;padding:16px 0 22px;color:var(--faint);
    font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

  .overlay{position:fixed;inset:0;background:rgba(20,20,26,.38);opacity:0;pointer-events:none;
    transition:opacity .2s ease;z-index:40}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(430px,92vw);background:var(--surface);
    border-left:1px solid var(--line-strong);box-shadow:-16px 0 46px rgba(20,20,26,.16);
    transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);z-index:41;display:flex;flex-direction:column}
  body.hist-open .overlay{opacity:1;pointer-events:auto}
  body.hist-open .drawer{transform:translateX(0)}
  body:not(.hist-open) .drawer{box-shadow:none}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:20px 18px 15px;border-bottom:2px solid var(--ink)}
  .drawer-head .title{font-size:16px;font-weight:800;letter-spacing:-.01em}
  .icon-btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);
    width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1}
  .icon-btn:hover{color:var(--ink);border-color:var(--faint)}
  .drawer-body{flex:1;overflow:auto;padding:14px 16px}
  .hist-empty{color:var(--faint);font-size:13px;text-align:center;padding:40px 10px;line-height:1.6}
  .entry{border:1px solid var(--line);border-radius:6px;padding:12px 13px;margin-bottom:10px;background:#FCFCFB}
  .entry-top{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
  .entry .mode-badge{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
    border-radius:3px;padding:2px 6px;font-weight:700}
  .mb-text{color:#362CB0;background:#ECEAFB}
  .mb-image{color:#0A6E63;background:#D9F1EE}
  .mb-video{color:#9A3412;background:#FBE7DD}
  .mb-code{color:#B01345;background:#FCE6EC}
  .entry .fmt-badge{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:2px 6px}
  .entry .ts{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto}
  .entry .etitle{font-weight:700;font-size:13.5px;margin:0 0 3px;word-break:break-word;letter-spacing:-.006em}
  .entry .eprev{color:var(--muted);font-size:12px;margin:0 0 9px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .entry-acts{display:flex;gap:6px}
  .entry-acts button{font-family:var(--sans);font-size:12px;border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink);border-radius:5px;padding:4px 9px;cursor:pointer;transition:all .12s ease}
  .entry-acts button:hover{border-color:var(--faint)}
  .entry-acts button.danger:hover{color:#B4351F;border-color:#E3A9A0}
  .drawer-foot{border-top:1px solid var(--line);padding:12px 16px}

  /* prompt quality: strength meter + hints */
  .quality{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:12px}
  .q-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .q-title{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .q-meter{display:inline-flex;gap:3px}
  .q-meter i{width:22px;height:6px;border-radius:2px;background:var(--line)}
  .quality[data-level="0"] .q-meter i:nth-child(-n+1){background:#C2410C}
  .quality[data-level="1"] .q-meter i:nth-child(-n+2){background:#C88A04}
  .quality[data-level="2"] .q-meter i:nth-child(-n+3){background:var(--ok)}
  .quality[data-level="3"] .q-meter i{background:var(--ok)}
  .q-level{font-size:12.5px;font-weight:700}
  .q-ok{font-size:12.5px;color:var(--ok);margin:8px 0 0}
  .q-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  .q-more{margin-top:8px}

  .hint{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--ink)}
  .hint .h-dot{flex:none;width:7px;height:7px;border-radius:50%;margin-top:6px;background:var(--faint)}
  .hint.sev-risk .h-dot{background:#B4351F}
  .hint.sev-conflict .h-dot{background:#C2410C}
  .hint.sev-warn .h-dot{background:#C88A04}
  .hint.sev-miss .h-dot{background:var(--line-strong)}
  .hint.sev-tip .h-dot{background:var(--accent)}
  .hint .h-body{flex:1;min-width:0}
  .hint .h-field{font:inherit;font-weight:700;color:var(--accent-ink);background:none;border:0;padding:0;cursor:pointer}
  .hint .h-field:hover{text-decoration:underline}
  .hint .h-acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .hint .h-acts button{font-family:var(--sans);font-size:11.5px;color:var(--accent-ink);background:var(--accent-tint);
    border:1px solid transparent;border-radius:20px;padding:2px 9px;cursor:pointer}
  .hint .h-acts button:hover{border-color:var(--accent)}
  .hint .h-x{flex:none;border:0;background:none;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;padding:2px 3px}
  .hint .h-x:hover{color:var(--ink)}
  .block .bh{margin-top:9px;display:flex;flex-direction:column;gap:7px}
  .block .bh .hint{font-size:12px;color:var(--muted)}
  .block .bh .hint.sev-risk,.block .bh .hint.sev-conflict,.block .bh .hint.sev-warn{color:var(--ink)}

  @media (max-width:880px){
    .app{padding:0 18px}
    .grid{grid-template-columns:1fr;gap:10px}
    .result-col{position:static}
    .output pre{max-height:none;min-height:200px}
    header{align-items:flex-start}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-mode="text">
<div class="app">
  <header>
    <div class="brand">
      <span class="mark" id="ui-mark"></span>
      <h1 id="ui-title"></h1>
      <p id="ui-sub"></p>
    </div>
    <div class="head-ctrl">
      <div class="segmented lang" role="group" aria-label="Jazyk / Language">
        <button data-lang="cs" aria-pressed="true">CS</button>
        <button data-lang="ru" aria-pressed="false">RU</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="act" id="histBtn"><span id="ui-hist"></span> <span class="badge" id="histCount">0</span></button>
    </div>
  </header>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-mode="text"  aria-selected="true"><span class="dot"></span><span data-tab="text"></span></button>
    <button class="tab" role="tab" data-mode="image" aria-selected="false"><span class="dot"></span><span data-tab="image"></span></button>
    <button class="tab" role="tab" data-mode="video" aria-selected="false"><span class="dot"></span><span data-tab="video"></span></button>
    <button class="tab" role="tab" data-mode="code"  aria-selected="false"><span class="dot"></span><span data-tab="code"></span></button>
  </div>

  <div class="grid">
    <section aria-label="Components">
      <div class="panel-head">
        <span class="title" id="ui-components"></span>
        <div class="ph-right">
          <span class="fill-meter"><b id="fillN">0</b> / <span id="fillT">0</span> <span id="fillWord"></span></span>
          <button class="clear-btn" id="clearBtn"></button>
        </div>
      </div>
      <div id="form"></div>
    </section>

    <section class="result-col" aria-label="Composed prompt">
      <div class="panel-head">
        <span class="title" id="ui-prompt"></span>
        <div class="segmented" id="fmtControl" role="group" aria-label="Output format"></div>
      </div>
      <p class="fmt-hint" id="fmtHint"></p>
      <div class="aspect-bar" id="aspectBar" style="display:none"></div>
      <div class="quality" id="quality" hidden>
        <div class="q-head">
          <span class="q-title" id="qTitle"></span>
          <span class="q-meter" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="q-level" id="qLevel"></span>
        </div>
        <p class="q-ok" id="qOk" hidden></p>
        <ul class="q-list" id="qList"></ul>
        <button type="button" class="link q-more" id="qMore" hidden></button>
      </div>
      <div class="output">
        <pre id="out" class="empty" aria-live="polite"></pre>
        <div class="output-foot">
          <span class="count" id="count"></span>
          <div class="acts">
            <button class="act" id="saveBtn"></button>
            <button class="act" id="dlBtn"></button>
            <button class="act primary" id="copyBtn"></button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <footer>
    <span id="ui-footL"></span>
    <span id="fmtNote"></span>
  </footer>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="History">
  <div class="drawer-head">
    <span class="title" id="ui-histTitle"></span>
    <button class="icon-btn" id="histClose" aria-label="Close">✕</button>
  </div>
  <div class="drawer-body" id="histList"></div>
  <div class="drawer-foot"><button class="link" id="histClear"></button></div>
</aside>

<div class="tip" id="tip" role="tooltip"></div>

<script>
(function(){
  "use strict";

  /* chips insert English terms (image/video models respond best to them) */
  var V = {
    composition:["close-up","extreme close-up","medium shot","wide shot","full body","portrait",
      "overhead / top-down","low angle","high angle","dutch angle","rule of thirds","centered","symmetrical"],
    lighting:["golden hour","blue hour","soft diffused light","hard light","backlight / rim light",
      "volumetric light","neon glow","studio softbox","cinematic lighting","chiaroscuro","overcast","low-key","high-key"],
    camera:["35mm","50mm","85mm","macro","wide-angle","telephoto","shallow depth of field","f/1.4",
      "tilt-shift","shot on film","long exposure","bokeh"],

  function tipContent(term){
    var g=GLOSS[term]; if(!g) return "";
    var vis="";
    if(g.vis){
      if(g.vis.indexOf("sw:")===0) vis='<div class="tip-vis" style="background:'+g.vis.slice(3)+'"></div>';
      else if(g.vis.indexOf("dg:")===0) vis='<div class="tip-vis">'+DG(g.vis.slice(3))+'</div>';
    }
    return vis+'<div class="tip-term">'+term+'</div><div class="tip-def">'+g.def[lang]+'</div>';
  }
  var tipEl=null;
  function showTip(anchor,term){
    if(!GLOSS[term]) return;
    if(!tipEl) tipEl=document.getElementById("tip");
    tipEl.innerHTML=tipContent(term); tipEl.classList.add("show");
    var r=anchor.getBoundingClientRect(), tr=tipEl.getBoundingClientRect();
    var left=Math.max(8,Math.min(r.left+r.width/2-tr.width/2, window.innerWidth-tr.width-8));
    var top=r.top-tr.height-8; if(top<8) top=r.bottom+8;
    tipEl.style.left=left+"px"; tipEl.style.top=top+"px";
  }
  function hideTip(){ if(!tipEl) tipEl=document.getElementById("tip"); tipEl.classList.remove("show"); }

    vague:H("{x} modelu nic neřekne. Popiš, v čem přesně: světlo, barva, materiál, emoce.",

    vagueT:H("{x} je vágní hodnocení. Formuluj kritérium: co přesně má vzniknout (délka, tón, struktura).",
      "{x} — размытая оценка. Сформулируй критерий: что именно должно получиться (длина, тон, структура).",

    boost:H("{x} jsou „kouzelná slova“ starých modelů. Flux, Nano Banana, Midjourney 7 i Veo je ignorují nebo obraz přepálí. Lepší je konkrétnost: materiál, světlo, optika.",
      "{x} — «волшебные слова» старых моделей. Flux, Nano Banana, Midjourney 7 и Veo их игнорируют или пережаривают картинку. Лучше конкретика: материал, свет, оптика.",
      "{x} are “magic words” from older models. Flux, Nano Banana, Midjourney 7 and Veo ignore them or overcook the image. Be concrete instead: material, light, optics."),
    negPos:H("{x}: zápor v popisu modely často čtou naopak — vidí slovo a nakreslí ho. Zákaz přesuň do negativu, vlastnost popiš kladně („bez rukávů“ → „sleeveless“).",
      "{x}: отрицание в описании модели часто читают наоборот — видят слово и рисуют его. Запрет перенеси в негатив, а признак опиши позитивно («без рукавов» → «sleeveless»).",
      "{x}: models often read negations backwards — they see the word and draw it. Move bans to the negative prompt and describe traits positively (“no sleeves” → “sleeveless”)."),
    negPosV:H("{x}: video modely zápory chápou špatně a zmíněné často přidají. Popiš, co v záběru je: ne „bez lidí“, ale „prázdná ulice“.",
      "{x}: видео-модели плохо понимают отрицания и часто добавляют упомянутое. Опиши, что в кадре есть: не «без людей», а «пустая улица».",
      "{x}: video models handle negations poorly and often add what you mention. Describe what is there: not “no people” but “an empty street”."),
    negField:H("V negativu vyjmenuj samotné objekty: „text, vodoznak“, ne „bez textu“. Slova „bez“ a „no“ jsou tam navíc a někdy škodí.",
      "В негативе перечисляй сами объекты: «текст, водяной знак», а не «без текста». Слова «без» и «no» там лишние и иногда мешают.",
      "In the negative prompt list the things themselves: “text, watermark”, not “no text”. Words like “no” are redundant there and can backfire."),

    k:{
      time:H("Jde o jinou denní dobu: teplé nízké slunce proti studenému soumraku. Vyber jedno.","Это разное время суток: тёплое низкое солнце против холодных сумерек. Выбери одно.","These are different times of day: warm low sun versus cold dusk. Pick one."),
      key:H("High-key je světlé a skoro bez stínů, low-key tmavé a kontrastní. Jsou to protiklady.","High-key — светло и почти без теней, low-key — темно и контрастно. Это противоположности.","High-key is bright with few shadows, low-key is dark and contrasty. They're opposites."),
      light:H("Hlavní světlo je buď tvrdé, nebo měkké. Chceš-li obojí, rozděl je: „měkké vyplňující, tvrdé protisvětlo“.","Основной свет либо жёсткий, либо мягкий. Если нужно оба — разведи: «мягкий заполняющий, жёсткий контровой».","The key light is either hard or soft. If you want both, split them: “soft fill, hard rim light”."),
      mono:H("Monochrom a barevná paleta se vylučují.","Монохром и цветная палитра исключают друг друга.","Monochrome and a colour palette cancel each other out."),
      temp:H("Teplé a studené tóny spolu fungují jen jako záměrný kontrast — pak to tak napiš: „teplé světlo, studené stíny“.","Тёплые и холодные тона вместе работают только как задуманный контраст — тогда так и напиши: «тёплый свет, холодные тени».","Warm and cool tones only work together as a deliberate contrast — then say so: “warm light, cool shadows”."),
      medium:H("Fotorealismus a ilustrace táhnou obraz opačným směrem. Chceš-li mix, pojmenuj ho, např. „semi-realistic anime“.","Фотореализм и иллюстрация тянут картинку в разные стороны. Если нужен микс — назови его явно, например «semi-realistic anime».","Photorealism and illustration pull the image in opposite directions. If you want a blend, name it, e.g. “semi-realistic anime”."),
      size:H("Detail a celek v jednom záběru si odporují. Jde-li o přechod ve videu, popiš ho ve „Vývoji scény“.","Крупный и общий план в одном кадре противоречат. Если это переход в видео — опиши его в «Развитии сцены».","A close-up and a wide shot in one frame contradict each other. If it's a transition in video, describe it in “Scene arc”."),
      angle:H("Podhled a nadhled zároveň nejdou.","Нижний и верхний ракурс одновременно невозможны.","A low and a high angle can't happen at once."),
      center:H("Střed a symetrie proti pravidlu třetin jsou různé kompozice.","Центр и симметрия против правила третей — это разные композиции.","Centred or symmetrical versus rule of thirds are different compositions."),
      lens:H("Širokoúhlý objektiv a teleobjektiv dávají opačnou perspektivu.","Широкоугольник и телевик дают противоположную перспективу.","Wide-angle and telephoto give opposite perspective."),

  function tr(o,map){ return fill(o[lang],map||{}); }

  /* ---------- правила ---------- */
  function analyze(){
    var s=st(), hints=[], f=fmts[mode];
    var val=function(id){ return (s[id]||"").trim(); };
    var has=function(id){ return val(id).length>0; };
    function add(h){ hints.push(h); }
    var desc=DESC[mode].filter(has);
    var descText=desc.map(val).join("\n");
    var any=MODES[mode].fields.some(function(fl){ return has(fl.id); });
    if(!any) return hints;

    /* 1. секреты и шаблонные заглушки — во всех режимах */
    MODES[mode].fields.forEach(function(fl){
      var v=val(fl.id); if(!v) return;
      var sec=firstMatch(RX_SECRET,v);
      if(sec){ var nm=sec.match(/^([\w-]+)\s*[:=]/); var shown=nm?nm[1]:sec.slice(0,4)+"…";
        add({id:"secret:"+fl.id,sev:"risk",field:fl.id,text:tr(M.secret,{x:qt(shown)})}); }
      if(!fl.code){ var ph=firstMatch(RX_PLACEHOLDER,v);
        if(ph) add({id:"ph:"+fl.id,sev:"warn",field:fl.id,text:tr(M.placeholder,{x:qt(ph)})}); }
    });

    /* 2. размытые оценки */
    desc.forEach(function(id){
      if(mode==="text"&&id==="examples") return;
      var w=findAll(RX_VAGUE,val(id));
      if(w.length) add({id:"vague:"+id+":"+w.map(lc).join("|"),sev:"warn",field:id,
        text:tr(mode==="image"||mode==="video"?M.vague:M.vagueT,{x:qlist(w)}),
        acts:[{t:"remove",f:id,words:w,label:tr(M.aRemove)+" "+qlist(w)}]});
    });

    /* 3. короткий / перегруженный ключевой блок */
    COVER[mode].crit.forEach(function(id){
      if(!has(id)||focusedField===id) return;
      var n=wordsN(val(id)), min=(mode==="image"||mode==="video")?3:4;
      if(id==="stack") return;
      if(n<min) add({id:"short:"+id,sev:"warn",field:id,text:tr(mode==="image"||mode==="video"?M.shortSubj:M.shortTask)});
    });
    if(mode==="image"||mode==="video"){
      MODES[mode].fields.forEach(function(fl){
        if(fl.size!=="sm"||!has(fl.id)) return;
        var n=wordsN(val(fl.id));
        if(n>45) add({id:"long:"+fl.id,sev:"tip",field:fl.id,text:tr(M.longBlock,{n:n})});
      });
    }

    /* 4. дубли между блоками */
    var seen={};
    MODES[mode].fields.forEach(function(fl){
      var v=val(fl.id); if(wordsN(v)<3) return;
      var k=lc(v).replace(/\s+/g," ").replace(/[.,;!]+$/,"");
      if(seen[k]) add({id:"dup:"+fl.id,sev:"tip",field:fl.id,text:tr(M.dup,{a:fieldLabel(seen[k]),b:fieldLabel(fl.id)}),
        acts:[{t:"clear",f:fl.id,label:tr(M.aClear)}]});
      else seen[k]=fl.id;
    });

    if(mode==="image"||mode==="video") visualRules();
    if(mode==="text") textRules();
    if(mode==="code") codeRules();

    /* 5. незаполненные важные блоки */
    var critOk=COVER[mode].crit.every(has);
    if(critOk){
      COVER[mode].rec.forEach(function(id){
        if(has(id)) return;
        var why=M.why[mode]&&M.why[mode][id]; if(!why) return;
        var fd=fieldDef(id), acts=[];
        if(fd&&fd.chips) fd.chips.slice(0,3).forEach(function(term){ acts.push({t:"chip",f:id,v:term,label:"+ "+term}); });
        add({id:"miss:"+id,sev:"miss",field:id,text:tr(M.miss,{f:fieldLabel(id),why:why[lang]}),inline:tr(M.missInline,{why:why[lang]}),acts:acts});
      });
    }
    return hints;

    /* ---- изображение и видео ---- */
    function visualRules(){
      var isImg=mode==="image";
      // «волшебные слова» — уместны только в тегах для SDXL
      if(!(isImg&&f==="tags")) desc.forEach(function(id){
        var w=findAll(RX_BOOST,val(id));
        if(w.length) add({id:"boost:"+id+":"+w.map(lc).join("|"),sev:"warn",field:id,text:tr(M.boost,{x:qlist(w)}),
          acts:[{t:"remove",f:id,words:w,label:tr(M.aRemove)+" "+qlist(w)}]});
      });
      // отрицания в позитивной части
      desc.forEach(function(id){
        var re=rxNegPhrase(), m, pairs=[];
        while((m=re.exec(val(id)))){ pairs.push({full:(m[1]+" "+m[2]).trim(),item:m[2].trim()}); }
        if(!pairs.length) return;
        var x=qlist(pairs.map(function(p){ return p.full; }));
        if(isImg) add({id:"negpos:"+id+":"+lc(x),sev:"warn",field:id,text:tr(M.negPos,{x:x}),
          acts:[{t:"toNeg",f:id,pairs:pairs,label:tr(M.aNeg)}]});
        else add({id:"negpos:"+id+":"+lc(x),sev:"warn",field:id,text:tr(M.negPosV,{x:x})});
      });
      // отрицания внутри негатива
      if(isImg&&has("negative")&&rxNegWord().test(val("negative")))
        add({id:"negfield",sev:"tip",field:"negative",text:tr(M.negField),acts:[{t:"strip",f:"negative",label:tr(M.aStrip)}]});
      // противоречия
      var ctext=desc.filter(function(id){ return id!=="arc"; }).map(val).join("\n");
      CONFLICTS.forEach(function(c){
        if(c.modes&&c.modes.indexOf(mode)<0) return;
        var a=firstMatch(C[c.a],ctext), b=firstMatch(C[c.b],ctext);
        if(!a||!b||lc(a)===lc(b)) return;
        if(c.k==="size"&&!isImg&&C.moveCam.test(ctext)) return; // в видео это может быть переход
        add({id:"conf:"+c.k,sev:"conflict",field:null,text:tr(M.conflict,{a:qt(a),b:qt(b),why:M.k[c.k][lang]})});
      });
      // кадр против сюжета
      var ar=aspects[mode];
      if(ar&&ar!=="—"){
        var vx=firstMatch(C.vertical,ctext), hx=firstMatch(C.horizontal,ctext);
        if(vx&&!hx&&["16:9","21:9","3:2"].indexOf(ar)>=0){ var to=isImg?"2:3":"9:16";
          add({id:"aspV:"+ar,sev:"tip",field:null,text:tr(M.aspectV,{x:qt(vx),ar:ar,to:to}),acts:[{t:"aspect",v:to,label:tr(M.aAspect,{v:to})}]}); }
        if(hx&&!vx&&["9:16","2:3","4:5"].indexOf(ar)>=0){
          add({id:"aspH:"+ar,sev:"tip",field:null,text:tr(M.aspectH,{x:qt(hx),ar:ar,to:"16:9"}),acts:[{t:"aspect",v:"16:9",label:tr(M.aAspect,{v:"16:9"})}]}); }
      }
      // оптика в иллюстрации
      var lx=firstMatch(C.lens,ctext), ix=firstMatch(C.illus,ctext);
      if(lx&&ix&&!C.photo.test(ctext)) add({id:"lensIllus",sev:"tip",field:isImg?"camera":null,text:tr(M.lensIllus,{x:qt(lx),y:qt(ix)})});
      // текст в кадре
      if(isImg){ var tq=firstMatch(/[«"“„][^«»"“”„]{1,40}[»"”“]/,["subject","action","environment","style"].map(val).join(" "));
        if(tq) add({id:"textimg",sev:"tip",field:"subject",text:tr(M.textInImage,{x:tq})}); }
      // флаги Midjourney
      var params=val("params"), flag=firstMatch(/--[a-z]+/i,params);
      if(flag&&!(isImg&&f==="midjourney")){
        var acts=isImg?[{t:"fmt",v:"midjourney",label:tr(M.aFmt,{v:"Midjourney"})}]:[];
        add({id:"mjflags",sev:"warn",field:"params",text:tr(M.mjFlags,{x:qt(flag),f:T().fmtNames[f]||f}),acts:acts});
      }
      if(/--ar\s/i.test(params)&&ar&&ar!=="—")
        add({id:"ardup",sev:"warn",field:"params",text:tr(M.arDup,{ar:ar}),acts:[{t:"aspect",v:"—",label:tr(M.aAspectOff)}]});
      if(isImg&&f==="midjourney"&&/--no\s/i.test(params)&&has("negative"))
        add({id:"nodup",sev:"warn",field:"params",text:tr(M.noDup)});
      // теги — короткие фразы
      if(isImg&&f==="tags") desc.forEach(function(id){
        if(val(id).split(",").some(function(p){ return wordsN(p)>6; }))
          add({id:"tagslong:"+id,sev:"tip",field:id,text:tr(M.tagsLong)});
      });
      // длина прозы
      if(f==="prose"){ var n=wordsN(compose()), lim=isImg?120:150;
        if(n>lim) add({id:"proselong",sev:"tip",field:null,text:tr(M.proseLong,{n:n})}); }
      // язык текста
      var cl=contentLang();
      if(cl!=="en"){
        var ln=M.langName[cl][lang];
        if(isImg&&(f==="midjourney"||f==="tags")) add({id:"langwarn",sev:"warn",field:null,text:tr(M.langWarn,{l:ln})});
        else add({id:"langtip:"+cl,sev:"tip",field:null,text:tr(M.langTip,{l:ln})});
      }
      if(!isImg){
        // несколько действий подряд
        var seq=(val("action")+" "+val("arc")).match(/(?:^|[^\p{L}])(затем|потом|после этого|then|after that|afterwards|pak|potom|poté|následně)(?![\p{L}])|→|->/giu);
        if(seq&&seq.length>=2) add({id:"vmulti",sev:"warn",field:has("arc")?"arc":"action",text:tr(M.videoMulti,{n:seq.length+1})});
        // длительность
        var dre=/(\d+(?:[.,]\d+)?)\s*(?:s|sec|secs|seconds?|с|сек\p{L}*|sekund\p{L}*|vteřin\p{L}*)(?![\p{L}])/giu, dm, dmax=null;
        var dtext=val("dynamics")+" "+params;
        while((dm=dre.exec(dtext))){ var v=parseFloat(dm[1].replace(",",".")); if(v>10&&(!dmax||v>dmax.v)) dmax={v:v,t:dm[0].trim()}; }
        if(dmax) add({id:"vlong",sev:"tip",field:has("dynamics")?"dynamics":"params",text:tr(M.videoLong,{x:qt(dmax.t)})});
        // слишком много движений камеры
        var cms=findAll(new RegExp(WB+"("+C.moveCam.source+")"+WE,"giu"),val("camera_move"));
        if(cms.length>2) add({id:"cammany",sev:"warn",field:"camera_move",text:tr(M.camMany,{n:cms.length,x:qlist(cms)})});
      }
    }

    /* ---- текст ---- */
    function textRules(){
      if(has("role")&&wordsN(val("role"))<=5&&/(эксперт|expert|помощник|assistant|asistent|специалист|specialist|odborník|профессионал|professional|\bAI\b|ИИ)/iu.test(val("role")))
        add({id:"rolegen",sev:"tip",field:"role",text:tr(M.roleGeneric)});
      commonInstructionRules(["task","context","format","constraints","notes"]);
      if(has("examples")&&val("examples").split(/\n/).filter(function(l){ return l.trim(); }).length<2)
        add({id:"oneex",sev:"tip",field:"examples",text:tr(M.oneExample)});
      var lenField=["task","format","constraints"].find(function(id){ return findAll(RX_LEN,val(id)).length; });
      if(lenField&&!/\d/.test(val("format")+val("constraints")+val("task"))){
        add({id:"lenvague",sev:"tip",field:lenField,text:tr(M.lenVague,{x:qlist(findAll(RX_LEN,val(lenField)))})});
      }
    }

    /* ---- код ---- */
    function codeRules(){
      var task=val("task");
      if(has("stack")&&!/\d/.test(val("stack"))) add({id:"versions",sev:"tip",field:"stack",text:tr(M.versions,{x:qt(val("stack").split(/[,+]/)[0].trim())})});
      var allText=MODES.code.fields.map(function(fl){ return val(fl.id); }).join("\n");
      if(/(ошибк|баг|не работает|падает|вылетает|\bbug|\berror|broken|crash|\bfails?\b|exception|chyb|nefunguj|padá)/iu.test(task)
        &&!/(error|exception|traceback|ошибка:|chyba:|\w+Error\b|line \d+|:\d+:\d+)/i.test(allText.replace(task,"")))
        add({id:"bugnoerr",sev:"warn",field:"task",text:tr(M.bugNoErr)});
      if(!has("existing_code")&&/(рефактор|отрефактор|доработ|исправ|почин|перепиш|refactor|\bfix|improve|modify|rewrite|uprav|oprav|vylepš|přepiš)/iu.test(task))
        add({id:"fixnocode",sev:"warn",field:"existing_code",text:tr(M.fixNoCode,{f:fieldLabel("existing_code")}),acts:[{t:"focus",f:"existing_code",label:tr(M.aGo)}]});
      var broad=findAll(rx(["сайт\\p{L}*","приложени\\p{L}*","app","website","web","aplikac\\p{L}*","бот\\p{L}*","bot","игр(?:а|у|ы|е|ой)","game","hr(?:a|u|y)"]),task)[0];
      if(broad&&wordsN(task)<=6) add({id:"broad",sev:"warn",field:"task",text:tr(M.tooBroad,{x:qt(task)})});
      var qv=findAll(rx(["best practices","лучш\\p{L}* практик\\p{L}*","clean code","чист\\p{L}* код\\p{L}*","оптимизир\\p{L}*","оптимизац\\p{L}*","optimi[sz]e","optimi[sz]ation","optimaliz\\p{L}*","production[- ]ready","enterprise"]),task+" "+val("constraints"));
      if(qv.length&&!/\d/.test(task+val("constraints")+val("testing")))
        add({id:"qvague",sev:"tip",field:"task",text:tr(M.qualityVague,{x:qlist(qv)})});
      var lines=val("existing_code").split("\n").length;
      if(has("existing_code")&&lines>300) add({id:"longcode",sev:"tip",field:"existing_code",text:tr(M.longCode,{n:lines})});
      commonInstructionRules(["task","constraints","contract"]);
    }

    function commonInstructionRules(ids){
      // капс и «ОБЯЗАТЕЛЬНО»
      ids.forEach(function(id){
        var v=val(id); if(!v) return;
        var caps=findAll(rx(["IMPORTANT","MUST","NEVER","ALWAYS","CRITICAL","ONLY","DO NOT","ОБЯЗАТЕЛЬНО","ВАЖНО","НИКОГДА","ВСЕГДА","ТОЛЬКО","НЕЛЬЗЯ","DŮLEŽITÉ","NIKDY","VŽDY","POUZE","NESMÍ","MUSÍ"]),v)
          .filter(function(w){ return w===w.toUpperCase(); });
        if(caps.length||/!{3,}/.test(v)) add({id:"shout:"+id,sev:"tip",field:id,text:tr(M.shout,{x:caps.length?qlist(caps):qt("!!!")})});
      });
      // одни запреты в ограничениях
      var cons=val("constraints");
      if(cons){
        var negs=cons.match(/(?:^|[^\p{L}])(не|нельзя|никогда|без|no|not|don'?t|never|avoid|ne|nikdy|nesmí|bez)(?![\p{L}])/giu)||[];
        var sentences=cons.split(/[.!?\n;]+/).filter(function(x){ return x.trim(); }).length;
        if(negs.length>=2&&negs.length>=sentences) add({id:"negonly",sev:"tip",field:"constraints",text:tr(M.negOnly)});
        if(sentences>=2&&wordsN(cons)>=8&&!/(потому что|так как|чтобы|because|so that|since|protože|aby|jelikož)/iu.test(cons))
          add({id:"nowhy",sev:"tip",field:"constraints",text:tr(M.noWhy)});
      }
    }
  }
  var RX_LEN=rx(["кратко","коротко","покороче","подробно","подробнее","развёрнуто","развернуто","briefly","concise(?:ly)?","short(?:er)?","detailed","in detail","stručně","krátce","podrobně","kratší"]);

  /* ---------- сила промпта ---------- */
  function strength(hints){
    var cov=COVER[mode], s=st();
    var filled=function(id){ return (s[id]||"").trim().length>0; };
    var part=function(arr){ return arr.length?arr.filter(filled).length/arr.length:1; };
    if(!MODES[mode].fields.some(function(fl){ return filled(fl.id); })) return null;
    var score=40*part(cov.crit)+40*part(cov.rec)+20*part(cov.nice), pen=0;
    hints.forEach(function(h){ if(h.sev==="risk"||h.sev==="conflict") pen+=12; else if(h.sev==="warn") pen+=7; });
    score-=Math.min(pen,45);
    if(part(cov.crit)<1) score=Math.min(score,39);
    return score>=85?3:score>=65?2:score>=40?1:0;
  }

  /* ---------- действия ---------- */
  function focusField(id){
    var fe=fieldEls.find(function(x){ return x.id===id; }); if(!fe) return;
    fe.block.scrollIntoView({block:"center",behavior:"smooth"}); fe.ta.focus({preventScroll:true});
  }
  function addChip(id,term){
    var cur=st()[id]||"";
    if(lc(cur).indexOf(lc(term))!==-1) return;
    setField(id,cur.trim()?cur.trim().replace(/,\s*$/,"")+", "+term:term);
  }
  function runAct(a){
    var v;
    if(a.t==="focus") return focusField(a.f);
    if(a.t==="chip") return addChip(a.f,a.v);
    if(a.t==="clear") return setField(a.f,"");
    if(a.t==="remove"){
      v=st()[a.f];
      a.words.forEach(function(w){ v=v.replace(new RegExp("("+WB+")"+esc(w)+WE,"giu"),"$1"); });
      return setField(a.f,cleanList(v));
    }
    if(a.t==="toNeg"){
      v=st()[a.f];
      a.pairs.forEach(function(p){ v=v.replace(p.full,""); });
      setField(a.f,cleanList(v));
      var neg=(st().negative||"").trim(), items=a.pairs.map(function(p){ return p.item; });
      return setField("negative",dedupList([neg].concat(items).filter(Boolean)));
    }
    if(a.t==="strip"){
      v=st()[a.f].replace(rxNegWord(),function(m,w){ return m.slice(0,m.length-w.length); }).replace(/\s{2,}/g," ");
      return setField(a.f,cleanList(v));
    }
    if(a.t==="aspect"){ aspects[mode]=a.v; buildAspectBar(); render(); persistDraft(); return; }
    if(a.t==="fmt"){ setFmt(a.v); return; }
  }

  /* ---------- отрисовка ---------- */
  function hintEl(h,withField){
    var li=document.createElement("li"); li.className="hint sev-"+h.sev;
    var body='<span class="h-dot" aria-hidden="true"></span><div class="h-body"><div class="h-text"></div><div class="h-acts"></div></div>'+
      '<button type="button" class="h-x" aria-label="'+M.dismiss[lang]+'" title="'+M.dismiss[lang]+'">×</button>';
    li.innerHTML=body;
    var txt=li.querySelector(".h-text");
    if(withField&&h.field){
      var fb=document.createElement("button"); fb.type="button"; fb.className="h-field"; fb.textContent=fieldLabel(h.field);
      fb.addEventListener("click",function(){ focusField(h.field); });
      txt.appendChild(fb); txt.appendChild(document.createTextNode(" · "));
    }
    txt.appendChild(document.createTextNode(h.text));
    var acts=li.querySelector(".h-acts");
    (h.acts||[]).forEach(function(a){
      var b=document.createElement("button"); b.type="button"; b.textContent=a.label;
      b.addEventListener("click",function(){ runAct(a); });
      acts.appendChild(b);
    });
    if(!acts.children.length) acts.remove();
    li.querySelector(".h-x").addEventListener("click",function(){
      dismissed[mode][h.id]=1; persistDraft(); renderHints();
    });
    return li;
  }

  function scheduleHints(){ clearTimeout(hintTimer); hintTimer=setTimeout(renderHints,280); }

  function renderHints(){
    clearTimeout(hintTimer);
    var panel=document.getElementById("quality");
    var all=analyze();
    var hints=all.filter(function(h){ return !dismissed[mode][h.id]; })
      .sort(function(a,b){ return SEV_ORDER[a.sev]-SEV_ORDER[b.sev]; });
    var level=strength(all);

    // подсказки под блоками
    fieldEls.forEach(function(fe){
      var mine=hints.filter(function(h){ return h.field===fe.id; });
      fe.bh.innerHTML="";
      var shown=0;
      mine.forEach(function(h){
        if(shown>=2) return;
        fe.bh.appendChild(hintEl(h.sev==="miss"?{id:h.id,sev:"miss",text:h.inline,acts:h.acts}:h,false));
        shown++;
      });
      fe.bh.hidden=!shown;
    });

    // панель
    if(level===null){ panel.hidden=true; return; }
    panel.hidden=false; panel.dataset.level=level;
    document.getElementById("qTitle").textContent=M.title[lang];
    document.getElementById("qLevel").textContent=M.levels[lang][level];
    var list=document.getElementById("qList"), more=document.getElementById("qMore"), ok=document.getElementById("qOk");
    list.innerHTML="";
    var LIMIT=3, vis=hintsOpen?hints:hints.slice(0,LIMIT);
    vis.forEach(function(h){ list.appendChild(hintEl(h,true)); });
    list.hidden=!hints.length;
    ok.hidden=!!hints.length; ok.textContent=M.ok[lang];
    if(hints.length>LIMIT){
      more.hidden=false;
      more.textContent=hintsOpen?M.less[lang]:fill(M.more[lang],{n:hints.length});
    } else more.hidden=true;
  }
  document.getElementById("qMore").addEventListener("click",function(){ hintsOpen=!hintsOpen; renderHints(); });

  var form=document.getElementById("form");
  var out=document.getElementById("out"), countEl=document.getElementById("count");
  var fillN=document.getElementById("fillN"), fillT=document.getElementById("fillT");
  var copyBtn=document.getElementById("copyBtn"), dlBtn=document.getElementById("dlBtn"), saveBtn=document.getElementById("saveBtn");
  var fmtControl=document.getElementById("fmtControl"), fmtHint=document.getElementById("fmtHint");
  var aspectBar=document.getElementById("aspectBar"), fmtNote=document.getElementById("fmtNote");
  var histList=document.getElementById("histList"), histCount=document.getElementById("histCount");
  var clearAllBtn=document.getElementById("clearBtn");
  var fieldEls=[];

  function setField(id,val){
    st()[id]=val;
    var fe=fieldEls.find(function(x){ return x.id===id; });
    if(fe){ fe.ta.value=val; fe.block.classList.toggle("filled",val.trim().length>0); }
    render(); persistDraft();
  }

  function buildForm(){
    form.innerHTML=""; fieldEls=[];
    var flds=MODES[mode].fields; fillT.textContent=flds.length;
    flds.forEach(function(f,i){
      var num=String(i+1).padStart(2,"0");
      var block=document.createElement("div");
      block.className="block"+(f.special?" special":"");
      block.innerHTML='<div class="lbl"><span class="num">'+num+'</span>'+
        '<label for="fld-'+f.id+'"></label>'+
        '<button type="button" class="clr" aria-label="'+CLR_LABEL[lang]+'" title="'+CLR_LABEL[lang]+'">×</button>'+
        '</div><p class="hint"></p>'+
        '<textarea id="fld-'+f.id+'" class="'+f.size+(f.code?" codearea":"")+'"></textarea>'+
        '<div class="bh" hidden></div>';
      form.appendChild(block);
      var ta=block.querySelector("textarea");
      var lab=block.querySelector("label"); lab.textContent=f.label[lang]; lab.setAttribute("for","fld-"+f.id);
      block.querySelector(".hint").textContent=f.hint[lang];
      ta.placeholder=f.ph[lang]; ta.value=st()[f.id];
      block.classList.toggle("filled",st()[f.id].trim().length>0);
      ta.addEventListener("focus",function(){ focusedField=f.id; });
      ta.addEventListener("blur",function(){ focusedField=null; renderHints(); });
      ta.addEventListener("input",function(){
        st()[f.id]=ta.value; block.classList.toggle("filled",ta.value.trim().length>0);
        render(); persistDraft();
      });
      block.querySelector(".clr").addEventListener("click",function(){ setField(f.id,""); });
      if(f.chips){
        var wrap=document.createElement("div"); wrap.className="chips";
        f.chips.forEach(function(term){
          var b=document.createElement("button"); b.type="button"; b.textContent=term;
          if(GLOSS[term]) b.classList.add("hasinfo");
          b.addEventListener("click",function(){
            hideTip();
            addChip(f.id,term);
          });
          b.addEventListener("mouseenter",function(){ showTip(b,term); });
          b.addEventListener("mouseleave",hideTip);
          b.addEventListener("focus",function(){ showTip(b,term); });
          b.addEventListener("blur",hideTip);
          wrap.appendChild(b);
        });
        block.appendChild(wrap);
      }
      fieldEls.push({id:f.id,block:block,ta:ta,bh:block.querySelector(".bh")});
    });
  }

  function buildFormatControl(){
    fmtControl.innerHTML="";
    MODES[mode].formats.forEach(function(o){
      var b=document.createElement("button");
      b.dataset.fmt=o.id; b.textContent=lbl(o.label);
      b.setAttribute("aria-pressed",String(o.id===fmts[mode]));
      b.addEventListener("click",function(){ setFmt(o.id); });
      fmtControl.appendChild(b);
    });
  }

  function buildAspectBar(){
    var cfg=MODES[mode].aspect;
    if(!cfg){ aspectBar.style.display="none"; aspectBar.innerHTML=""; return; }
    aspectBar.style.display="flex"; aspectBar.innerHTML="";
    var lb=document.createElement("span"); lb.className="ar-lbl"; lb.textContent=T().aspectLbl; aspectBar.appendChild(lb);
    cfg.opts.forEach(function(op){
      var b=document.createElement("button"); b.textContent=op;
      b.setAttribute("aria-pressed",String(op===aspects[mode]));
      b.addEventListener("click",function(){ aspects[mode]=op; buildAspectBar(); render(); persistDraft(); });
      aspectBar.appendChild(b);
    });
  }

  function renderFmtHint(){
    var h=HINTS[mode]&&HINTS[mode][fmts[mode]];
    fmtHint.textContent=h?h[lang]:"";
    fmtNote.textContent=T().fmtNoteFn(T().fmtNames[fmts[mode]]);
  }

  function render(){ renderOut(); scheduleHints(); }
  function renderOut(){
    var text=compose();
    var filledN=MODES[mode].fields.filter(function(f){ return st()[f.id].trim(); }).length;
    fillN.textContent=filledN;
    clearAllBtn.disabled=filledN===0;
    if(!text){
      out.textContent=T().empty; out.classList.add("empty");
      countEl.textContent=T().countFn(0,0);
      copyBtn.disabled=dlBtn.disabled=saveBtn.disabled=true; return;
    }
    out.textContent=text; out.classList.remove("empty");
    var words=text.trim().split(/\s+/).filter(Boolean).length;
    countEl.textContent=T().countFn(text.length.toLocaleString(T().loc),words.toLocaleString(T().loc));
    copyBtn.disabled=dlBtn.disabled=saveBtn.disabled=false;
  }

  function setFmt(v){
    fmts[mode]=v;
    Array.prototype.forEach.call(fmtControl.children,function(b){
      b.setAttribute("aria-pressed",String(b.dataset.fmt===v)); });
    renderFmtHint(); render(); persistDraft();
  }

  function applyStatic(){
    document.documentElement.lang=lang;
    var m={"ui-mark":"mark","ui-title":"title","ui-sub":"sub","ui-components":"components",
      "ui-prompt":"prompt","ui-hist":"hist","ui-histTitle":"histTitle","ui-footL":"footL",
      "fillWord":"fillWord","clearBtn":"clearAll","histClear":"clearHist"};
    Object.keys(m).forEach(function(id){ document.getElementById(id).textContent=T()[m[id]]; });
    dlBtn.textContent=T().download; saveBtn.textContent=T().save;
    if(!copyBtn.classList.contains("done"))copyBtn.textContent=T().copy;
    document.querySelectorAll("[data-tab]").forEach(function(el){ el.textContent=MODES[el.dataset.tab].tab[lang]; });
  }

  function switchMode(m){
    mode=m; document.body.dataset.mode=m;
    document.querySelectorAll(".tab").forEach(function(t){
      t.setAttribute("aria-selected",String(t.dataset.mode===m)); });
    buildForm(); buildFormatControl(); buildAspectBar(); renderFmtHint(); render(); persistDraft();
  }

  function setLang(v){
    lang=v;
    document.querySelectorAll(".segmented.lang button").forEach(function(b){
      b.setAttribute("aria-pressed",String(b.dataset.lang===v)); });
    applyStatic(); buildForm(); buildAspectBar(); renderFmtHint(); render(); renderHistory(); persistDraft();
  }

  function copyText(text,btn,ok,reset){
    var done=function(){ btn.textContent=ok; btn.classList.add("done");
      setTimeout(function(){ btn.textContent=reset; btn.classList.remove("done"); },1400); };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,fb); } else { fb(); }
    function fb(){ var t=document.createElement("textarea"); t.value=text; t.style.position="fixed"; t.style.opacity="0";
      document.body.appendChild(t); t.select(); try{ document.execCommand("copy"); done(); }catch(e){} document.body.removeChild(t); }
  }
  copyBtn.addEventListener("click",function(){ var x=compose(); if(x)copyText(x,copyBtn,T().copied,T().copy); });
  dlBtn.addEventListener("click",function(){
    var x=compose(); if(!x)return;
    var blob=new Blob([x],{type:"text/plain;charset=utf-8"}), url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download="prompt-"+mode+"-"+fmts[mode]+".txt";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },500);
  });
  function armConfirm(btn,label,action){
    if(btn.dataset.armed==="1"){
      clearTimeout(btn._t); btn.dataset.armed="0"; btn.classList.remove("arm");
      btn.textContent=btn._orig; action(); return;
    }
    btn._orig=btn.textContent; btn.textContent=label; btn.classList.add("arm"); btn.dataset.armed="1";
    btn._t=setTimeout(function(){
      btn.dataset.armed="0"; btn.classList.remove("arm"); btn.textContent=btn._orig;
    },3000);
  }

  clearAllBtn.addEventListener("click",function(){
    if(clearAllBtn.disabled) return;
    armConfirm(clearAllBtn,T().clearSure,function(){
      MODES[mode].fields.forEach(function(f){ st()[f.id]=""; });
      dismissed[mode]={};
      buildForm(); render(); persistDraft();
    });
  });

  function makeTitle(){
    var keys=MODES[mode].titleFrom, raw="";
    for(var i=0;i<keys.length&&!raw;i++)raw=(st()[keys[i]]||"").trim();
    raw=raw.replace(/\s+/g," ");
    if(!raw)return T().untitled;
    return raw.length>52?raw.slice(0,52)+"…":raw;
  }
  function fmtTime(ts){ try{ return new Date(ts).toLocaleString(T().loc,
    {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }

  function saveSnapshot(){
    var text=compose(); if(!text)return;
    history.unshift({id:Date.now()+"-"+Math.random().toString(36).slice(2,7),ts:Date.now(),
      mode:mode,fmt:fmts[mode],aspect:aspects[mode],title:makeTitle(),
      state:JSON.parse(JSON.stringify(st())),text:text});
    if(history.length>60)history=history.slice(0,60);
    persistHistory(); renderHistory();
    saveBtn.textContent=T().saved; saveBtn.classList.add("done");
    setTimeout(function(){ saveBtn.textContent=T().save; saveBtn.classList.remove("done"); },1300);
  }
  saveBtn.addEventListener("click",saveSnapshot);

  function restoreEntry(id){
    var e=history.find(function(x){ return x.id===id; }); if(!e)return;
    var m=e.mode&&MODES[e.mode]?e.mode:"text";
    MODES[m].fields.forEach(function(f){ states[m][f.id]=(e.state&&e.state[f.id])||""; });
    if(e.fmt)fmts[m]=e.fmt;
    if(e.aspect!==undefined&&MODES[m].aspect)aspects[m]=e.aspect;
    switchMode(m); closeDrawer();
  }
  function deleteEntry(id){ history=history.filter(function(x){ return x.id!==id; }); persistHistory(); renderHistory(); }

  function renderHistory(){
    histCount.textContent=history.length;
    if(!history.length){ histList.innerHTML='<div class="hist-empty">'+T().histEmpty.replace(/\n/g,"<br>")+'</div>'; return; }
    histList.innerHTML="";
    history.forEach(function(e){
      var m=e.mode||"text";
      var card=document.createElement("div"); card.className="entry";
      card.innerHTML='<div class="entry-top">'+
        '<span class="mode-badge mb-'+m+'">'+MODES[m].badge[lang]+'</span>'+
        '<span class="fmt-badge">'+(e.fmt||"")+'</span>'+
        '<span class="ts">'+fmtTime(e.ts)+'</span></div>'+
        '<p class="etitle"></p><p class="eprev"></p>'+
        '<div class="entry-acts"><button data-a="restore">'+T().restore+'</button>'+
        '<button data-a="copy">'+T().copy+'</button>'+
        '<button data-a="del" class="danger">'+T().del+'</button></div>';
      card.querySelector(".etitle").textContent=e.title||T().untitled;
      card.querySelector(".eprev").textContent=e.text.replace(/\s+/g," ").trim();
      card.querySelector('[data-a="restore"]').addEventListener("click",function(){ restoreEntry(e.id); });
      card.querySelector('[data-a="del"]').addEventListener("click",function(){ deleteEntry(e.id); });
      card.querySelector('[data-a="copy"]').addEventListener("click",function(ev){ copyText(e.text,ev.currentTarget,T().copied,T().copy); });
      histList.appendChild(card);
    });
  }
  document.getElementById("histClear").addEventListener("click",function(){
    if(!history.length)return;
    armConfirm(this,T().clearSure,function(){ history=[]; persistHistory(); renderHistory(); });
  });

  var drawerEl=document.getElementById("drawer"), histBtnEl=document.getElementById("histBtn");
  drawerEl.inert=true; drawerEl.setAttribute("aria-hidden","true");
  function openDrawer(){
    document.body.classList.add("hist-open");
    drawerEl.inert=false; drawerEl.removeAttribute("aria-hidden");
    document.getElementById("histClose").focus();
  }
  function closeDrawer(){
    if(!document.body.classList.contains("hist-open")) return;
    document.body.classList.remove("hist-open");
    drawerEl.inert=true; drawerEl.setAttribute("aria-hidden","true");
    histBtnEl.focus();
  }
  document.getElementById("histBtn").addEventListener("click",openDrawer);
  document.getElementById("histClose").addEventListener("click",closeDrawer);
  document.getElementById("overlay").addEventListener("click",closeDrawer);
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&document.body.classList.contains("hist-open"))closeDrawer(); });

  document.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click",function(){ if(t.dataset.mode!==mode)switchMode(t.dataset.mode); }); });
  document.querySelectorAll(".segmented.lang button").forEach(function(b){
    b.addEventListener("click",function(){ setLang(b.dataset.lang); });
    b.setAttribute("aria-pressed",String(b.dataset.lang===lang)); });

  window.addEventListener("scroll",hideTip,true);
  window.addEventListener("resize",hideTip);

  applyStatic();
  switchMode(mode);
  renderHistory();
})();
</script>
</body>
</html>
